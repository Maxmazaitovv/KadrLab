
name: KadrLab Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project ZIP
        run: |
          unzip -q KadrLab-Stage2-Without-Build-YML.zip -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KadrLab-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
